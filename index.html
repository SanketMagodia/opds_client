<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #d9dad4;
    --sheet: #e8e9e4;
    --ink: #232422;
    --muted: #62645f;
    --rule: #b3b5ae;
    --act: #1f4fa3;
    --warn: #9a2b1d;
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1b1c1a;
      --sheet: #252624;
      --ink: #e3e4de;
      --muted: #9a9c95;
      --rule: #3b3d39;
      --act: #8fb0f0;
      --warn: #f09a8a;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 var(--sans);
  }
  main { max-width: 620px; margin: 0 auto; padding: 28px 18px 48px; }
  h1 {
    font: 600 2.2rem/1.1 var(--serif);
    margin: 0 0 4px;
  }
  .sub { color: var(--muted); margin: 0 0 28px; }

  /* The one bold thing: the drop sheet, like a blank e-ink page */
  .drop {
    background: var(--sheet);
    border: 2px dashed var(--rule);
    border-radius: 6px;
    padding: 22px 18px;
    display: grid;
    gap: 12px;
  }
  .drop.over { border-color: var(--act); }
  .pick {
    font: 400 1.15rem/1.3 var(--serif);
    cursor: pointer;
  }
  .pick input { display: none; }
  .pick span { color: var(--muted); }
  .pick b { font-weight: 600; color: var(--ink); }
  input[type=text] {
    font: inherit;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
  }
  button {
    font: 600 1rem var(--sans);
    border: 0;
    border-radius: 4px;
    padding: 11px 16px;
    background: var(--act);
    color: var(--sheet);
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--act); outline-offset: 2px; }
  .status { min-height: 1.5em; margin: 10px 2px 0; color: var(--muted); }
  .status.err { color: var(--warn); }

  h2 {
    font: 600 1.25rem var(--serif);
    margin: 36px 0 6px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  h2 small { font: 400 .9rem var(--sans); color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 12px 2px;
    border-bottom: 1px solid var(--rule);
  }
  .meta { flex: 1; min-width: 0; }
  .meta a {
    font: 400 1.05rem/1.35 var(--serif);
    color: var(--ink);
    text-decoration-color: var(--rule);
    overflow-wrap: anywhere;
  }
  .meta div { font-size: .85rem; color: var(--muted); }
  .del {
    background: none;
    color: var(--warn);
    padding: 6px 8px;
    font-weight: 400;
  }
  .empty { color: var(--muted); padding: 16px 2px; }
</style>
</head>
<body>
<main>
  <h1>Shelf</h1>
  <p class="sub">Files here show up in your OPDS catalog on the next refresh.</p>

  <div class="drop" id="drop">
    <label class="pick">
      <input type="file" id="file" accept=".epub,.txt,.xtc">
      <b id="fileName">Choose a file</b> <span>or drop it here. EPUB, TXT or XTC.</span>
    </label>
    <input type="text" id="title" placeholder="Title (optional)">
    <button id="upload" disabled>Upload and commit</button>
  </div>
  <p class="status" id="status" role="status"></p>

  <h2>In the catalog <small id="count"></small></h2>
  <ul id="list"><li class="empty">Loading the catalog…</li></ul>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fileInput = $("file"), btn = $("upload"), statusEl = $("status");

function say(msg, isErr = false) {
  statusEl.textContent = msg;
  statusEl.className = "status" + (isErr ? " err" : "");
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail; } catch {}
    throw new Error(detail);
  }
  return r.json();
}

function fmt(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return isNaN(d) ? ts : d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
}

async function load() {
  const list = $("list");
  try {
    const items = await api("/api/items");
    $("count").textContent = items.length + (items.length === 1 ? " item" : " items");
    list.innerHTML = "";
    if (!items.length) {
      list.innerHTML = '<li class="empty">Nothing in the catalog yet. Upload a file above.</li>';
      return;
    }
    for (const it of items) {
      const li = document.createElement("li");
      const meta = document.createElement("div");
      meta.className = "meta";
      const a = document.createElement(it.href ? "a" : "span");
      a.textContent = it.title || it.id;
      if (it.href) { a.href = it.href; a.target = "_blank"; a.rel = "noopener"; }
      const when = document.createElement("div");
      when.textContent = fmt(it.updated);
      meta.append(a, when);
      li.append(meta);

      if (it.id && it.id.startsWith("urn:manual:")) {
        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "Delete";
        del.onclick = () => remove(it);
        li.append(del);
      }
      list.append(li);
    }
  } catch (e) {
    list.innerHTML = "";
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "Couldn't read the catalog: " + e.message;
    list.append(li);
  }
}

function setFile(f) {
  if (!f) return;
  const dt = new DataTransfer();
  dt.items.add(f);
  fileInput.files = dt.files;
  $("fileName").textContent = f.name;
  btn.disabled = false;
}

fileInput.onchange = () => setFile(fileInput.files[0]);

const drop = $("drop");
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  setFile(e.dataTransfer.files[0]);
});

btn.onclick = async () => {
  const f = fileInput.files[0];
  if (!f) return;
  const body = new FormData();
  body.append("file", f);
  body.append("title", $("title").value);
  btn.disabled = true;
  say("Uploading and committing…");
  try {
    const res = await api("/api/upload", { method: "POST", body });
    say("Committed " + res.file + ". It'll appear on the reader after the next refresh.");
    fileInput.value = "";
    $("title").value = "";
    $("fileName").textContent = "Choose a file";
    load();
  } catch (e) {
    say("Upload failed: " + e.message, true);
    btn.disabled = false;
  }
};

async function remove(it) {
  if (!confirm(`Delete "${it.title}" from the catalog and the repo?`)) return;
  say("Deleting…");
  try {
    await api("/api/items?id=" + encodeURIComponent(it.id), { method: "DELETE" });
    say("Deleted " + it.title + ".");
    load();
  } catch (e) {
    say("Delete failed: " + e.message, true);
  }
}

load();
</script>
</body>
</html>
